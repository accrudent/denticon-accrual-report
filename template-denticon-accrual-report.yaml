  - cellType: SQL
    cellId: 019bc3af-f0c6-7005-b50f-59f5909a31f0 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: AR - Group by Proc
    config:
      source: |-
        select -- grabbing all procedures, and applying adjustments and payments to them
            p.ar_date,
            p.warehouse_id,
            p.guar_id,
            p.location_id,
            p.t_id,
            p.eff_time,
            p.tran_type,
            max(p.amount) + sum(t.amount) as amount,
            p.ins_est
        from ftrans p
        left join ftrans t on p.warehouse_id = t.t_id -- and t.tran_type != 'proc'
        where p.tran_type = 'proc'
        group by
            p.ar_date,
            p.warehouse_id,
            p.guar_id,
            p.location_id,
            p.t_id,
            p.eff_time,
            p.tran_type,
            p.amount,
            p.ins_est

        union all

        select -- grabbing all adjustments and payments not allocated to procedures
            t.*
        from ftrans t
        left join ftrans p on t.t_id = p.warehouse_id
        where t.tran_type != 'proc'
        and p.warehouse_id is null

