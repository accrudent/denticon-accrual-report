    cellLabel: LEDGER PAY ALLOCATION
    config:
      source: |-
        select  l.[DESCR], sum(lpa.[AMOUNT]) as lpa_amount
        from denticon.ledgerpayalloc lpa
        left join [denticon].[LEDGER] l on lpa.[PAYLEDGERID] = l.[LEDGERID]
        where 1=1 
        and l.oid = '110'
        and lpa.[ALLOCDATE] >= '2025-06-01' and lpa.[ALLOCDATE] <= '2025-06-30'
        and lpa.[LTYPE] = 'A'
        --and l.[DESCR] not like 'FEE-NO SHOW'
        --and l.[DESCR] not like '%refund%'
        group by l.[DESCR]
        --and l.[DESCR] = 'ADJ OFF - Uncollectable Balanc'
        --and lpa.PAYLEDGERID = '10702760'
