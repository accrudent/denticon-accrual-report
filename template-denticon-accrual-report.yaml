  - cellType: SQL
    cellId: 019bc3af-f0c6-7005-b50f-27c070121f6e # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Transactions
    config:
      source: |-
        select 
            cast(l.ledgerid as varchar) as warehouse_id, --just ledger id if procedure
            cast(l.rpid as varchar) as guar_id,
            cast(l.oid as varchar) as location_id, 
            null as t_id,
            cast(l.dosdate as date) as proc_time,
            cast(l.trandate as date) as tran_time,
            cast(l.trandate as date) as eff_time,
            'proc' as tran_type, -- simplified this, because we are already filtering out just procedures
            l.amount
        from denticon.ledger l
        where l.[LTYPE] in ('C')

        union all

        select 
            cast(lpa.payallocid as varchar) as warehouse_id, --if P, I, A, payallocid as id
            cast(lpa.rpid as varchar) as guar_id,
            cast(l.oid as varchar) as location_id, 
            cast(lpa.procledgerid as varchar) as t_id, --ties pay/payalloc to procedure, null if procledgerid is null
            cast(ll.dosdate as date) as proc_time, --ties pay/payalloc to procedure date, null if procledgerid is null
            cast(l.trandate as date) as tran_time,
            cast(l.trandate as date) as eff_time,
            case
                when lpa.ltype = 'P' then 'pat_pay'
                when lpa.ltype = 'I' then 'ins_pay'

                when lpa.ltype = 'A' and l.[DESCR] like 'INSURANCE RECOUPMENT' then 'insrefund_adj' --insurance refund

                when lpa.ltype = 'A' and l.[DESCR] like '%ins%' then 'ins_adj' --insurance adjustment
                when lpa.ltype = 'A' and l.[DESCR] like 'ADJ OFF - Contract Adjustments' then 'ins_adj' --insurance adjustment
                when lpa.ltype = 'A' and l.[DESCR] like 'ADJ OFF - Ins Agreement' then 'ins_adj' --insurance adjustment
                when lpa.ltype = 'A' and l.[DESCR] like 'AUTO - Insurance Adjustment(P)' then 'ins_adj' --insurance adjustment

                when lpa.ltype = 'A' and l.[DESCR] like 'FEE-NO SHOW' then 'fees_adj' --temporary 

                when lpa.ltype = 'A' and l.[DESCR] like 'ADJ OFF - Courtesy Discount' then 'discount_adj' --discount
                when lpa.ltype = 'A' and l.[DESCR] like 'ADJ OFF - Uncollectable Balanc' then 'bd_adj' --bad debt
                when lpa.ltype = 'A' and l.[DESCR] like 'ADJ OFF - Coupon' then 'discount_adj' --discount
                when lpa.ltype = 'A' and l.[DESCR] like 'ADJ OFF - Failed Treatment' then 'discount_adj' --discount
                when lpa.ltype = 'A' and l.[DESCR] like 'ADJ OFF - Treatment Incomplete'then 'discount_adj' --discount
                when lpa.ltype = 'A' and l.[DESCR] like 'REFUND - Voided' then 'discount_adj' --discount
                when lpa.ltype = 'A' and l.[DESCR] like 'ADJ OFF - Bad Debt' then 'bd_adj' --bad debt
                when lpa.ltype = 'A' and l.[DESCR] like 'ADJ OFF - Special Promotion' then 'discount_adj'--discount
                when lpa.ltype = 'A' and l.[DESCR] like 'OrthoFX- Promo Discount' then 'discount_adj'--discount
                when lpa.ltype = 'A' and l.[DESCR] like 'REFUND - Patient' then 'patrefund_adj'--patrefund_adj
                when lpa.ltype = 'A' and l.[DESCR] like 'REFUND - 3rd Party Finance' then 'patrefund_adj'--patrefund_adj
                when lpa.ltype = 'A' and l.[DESCR] like 'REFUND - Credit Card' then 'patrefund_adj'--patrefund_adj

                else 'unknown_adj' 
            end as tran_type,
            lpa.amount
        from [denticon].[LEDGERPAYALLOC] lpa
        left join [denticon].[LEDGER] l on lpa.[PAYLEDGERID] = l.[LEDGERID] --P, I, A
        left join [denticon].[LEDGER] ll on lpa.[PROCLEDGERID] = ll.[LEDGERID] --procedures
        where lpa.ltype in ('P', 'I', 'A')
      dataFrameCell: false
