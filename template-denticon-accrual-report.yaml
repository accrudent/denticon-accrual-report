    cellId: 019bc3af-f0c6-7005-b50f-6be369b25dbc # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: AR - Patient Aging Breakdown
    config:
      source: |-
        select
            p.ar_date,
            p.given_name,
            p.family_name,
            p.guar_id,
            p.location_id,
            sum(case when p.aging = '120+' then p.ins_est else 0 end) ins_over_120,
            sum(case when p.aging = '91-120' then p.ins_est else 0 end) ins_91_120,
            sum(case when p.aging = '61-90' then p.ins_est else 0 end) ins_61_90,
            sum(case when p.aging = '31-60' then p.ins_est else 0 end) ins_31_60,
            sum(case when p.aging = '0-30' then p.ins_est else 0 end) ins_0_30,
            sum(case when p.balance > 0 and p.aging = '120+' then p.balance else 0 end) pat_over_120,
            sum(case when p.balance > 0 and p.aging = '91-120' then p.balance else 0 end) pat_91_120,
            sum(case when p.balance > 0 and p.aging = '61-90' then p.balance else 0 end) pat_61_90,
            sum(case when p.balance > 0 and p.aging = '31-60' then p.balance else 0 end) pat_31_60,
            sum(case when p.balance > 0 and p.aging = '0-30' then p.balance else 0 end) pat_0_30,
            sum(case when p.balance < 0 then p.balance else 0 end) payments,
            sum(p.balance) balance,
            sum(p.ins_est) ins_est,
            sum(p.balance + p.ins_est) pat_resp,
            sum(case when p.balance < 0 then p.balance else 0 end + p.ins_est) unapplied_credits,
        from ar_dos p
        group by
            p.ar_date,
            p.given_name,
            p.family_name,
            p.guar_id,
            p.location_id
