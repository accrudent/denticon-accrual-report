  - cellType: CODE
    cellId: 019bc3af-f036-7005-b4f8-ea2582a87ba8 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Python Variable Definitions
    config:
      source: |-
        from datetime import date
        from dateutil.relativedelta import relativedelta
        from dateutil import parser

        today = date.today()

        focus_month = today.replace(day=1)
        focus_month_name = focus_month.strftime("%b")

        month_p1 = focus_month + relativedelta(months=1)
        month_p1_name = month_p1.strftime("%b")

        month_m1 = focus_month - relativedelta(months=1)
        month_m1_name = month_m1.strftime("%b")

        month_m2 = focus_month - relativedelta(months=2)
        month_m2_name = month_m2.strftime("%b")

        month_m3 = focus_month - relativedelta(months=3)
        month_m3_name = month_m3.strftime("%b")

        month_m4 = focus_month - relativedelta(months=4)
        month_m4_name = month_m4.strftime("%b")

        month_m5 = focus_month - relativedelta(months=5)
        month_m5_name = month_m5.strftime("%b")

        month_m6 = focus_month - relativedelta(months=6)
        month_m6_name = month_m6.strftime("%b")

        payment_types = ['ins_pay', 'pat_pay', 'ucr_writeoff']
        adj_prod_types = ['proc', 'bd_adj', 'discount_adj', 'payplan_adj', 'patrefund_adj', 'insrefund_adj', 'unknown_adj'] # not including 'ucr_writeoff' here, because we're treating those as part of insurance payments
