    cellId: 019bc3af-f0c7-7005-b50f-8be4a9be52a5 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: respparty OID = payalloc OID
    config:
      source: |-
        with oid_cte as (select top 10000
            lpa.[OID] as payalloc_oid,
            l.[OID] as ledger_oid,
            rp.[OID] as rp_oid,
            l.[DESCR],
            lpa.[AMOUNT] as lpa_amount,
            lpa.[ALLOCDATE],
            l.[DOSDATE],
            l.[TRANDATE]
        from [denticon].[LEDGERPAYALLOC] lpa
        left join [denticon].[LEDGER] l on lpa.[PAYLEDGERID] = l.[LEDGERID] --P, I, A
        left join [denticon].[RESPPARTY] rp on l.[RPID] = rp.[RPID]  -- respparty
        where rp.[OID] = lpa.[OID] -- where payalloc oid is not the same as ledger oid
        and l.[TRANDATE] > '2025-01-01'
        order by l.[TRANDATE])

        select *
        from oid_cte oid
        where oid.payalloc_oid = oid.ledger_oid and oid.ledger_oid = oid.rp_oid

        --when respparty is the same as payalloc oid, almost everything aligns.
