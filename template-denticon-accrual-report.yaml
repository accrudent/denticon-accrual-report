    cellId: 019bc3af-f0c6-7005-b50f-561b96d229bc # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: AR - Filtered Trans
    config:
      source: |-
        select
            {{ar_date}} ar_date,
            t.warehouse_id,
            t.guar_id,
            t.location_id,
            t.t_id,
            t.eff_time,
            t.tran_type,
            t.amount,
            0 ins_est
        from trans t
        where t.eff_time < {{ar_date}}
        -- and guar_id = '9035290'

        union all

        select
            {{ar_date}} ar_date,
            c.warehouse_id,
            c.guar_id,
            c.location_id,
            null as t_id,
            c.submit_time as eff_time,
            'ins_est' as tran_type,
            0 as amount,
            -(case when c.state = 'CLOSED' then c.total_paid_amount else c.estimated_insurance_payment end) as ins_est
        from enriched_claims c 
        where c.state in ('CREATED', 'SUBMITTED', 'CLOSED')
        and c.submit_time is not null
        and c.submit_time < {{ar_date}}
        and (case 
            when c.state in ('CREATED', 'SUBMITTED') then cast({{ar_date}} + interval 1 day as date) -- include all claims still in submitted status
            when c.pay_time is null and c.state = 'CLOSED' then c.update_time -- if a claim was "paid" but we didn't receive a payment, go based on update_time
            else c.pay_time -- most claims have been paid normally, and will use this option
        end) > {{ar_date}}
        -- and guar_id = '9035290'

        order by eff_time desc
