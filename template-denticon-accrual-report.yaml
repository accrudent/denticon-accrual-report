    cellLabel: PROD - Office Balances
    config:
      source: |-
        select
            pb.eff_month,
            o.officename,
            pb.location_id,
            round(sum(pb.prod), 2) prod,
            round(sum(pb.ucr_writeoff), 2) ucr_writeoff,
            round(sum(pb.ins_adj), 2) ins_adj,
            round(sum(pb.discount_adj), 2) discount_adj,
