    cellId: 019bc3af-f007-7005-b4f6-8b6d2d90d3d5 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Header
    config:
      source: |-
        # Template Denticon Accrual Report

        ## Notes for Devs

        - payment allocation is tied to rpid OID, must use ledger OID
        - they dont include refund as adjustment for net production
        - they do not include 'fee - no show' as adjustment for net production- can we add adjustment type for this? maybe fees_coll_adj? 


        ## To Do
        * Build the transactions table
            * Includes a primary key, also a self referencing key to procedures (if applicable)
            * Include all procedures from `ledger`
            * Include everything from `ledgerpayalloc`
            * Include all payments and procedures from `ledger` not covered by `ledgerpayalloc`
                * Left joined `ledgerpayalloc` to `ledger`, then subtracted everything from `ledgerpayalloc` and added the remainder to the table. 
        * Tie out patient balances
        * Build out enriched claims (proc/submit date, paydate)
        * Production report - group by month and patient, then by office
            * This is simple enough we don't need a time filter
        * AR report
            * Filtered transaction by date - all transactions happened before the filter date, claims that were submitted but not paid on filter date
            * Sum up balalnces by procedure
            * Group by aging
            * Group by patient
            * True patient aging
            * Group by office
  - cellType: MARKDOWN
    cellId: 019bc3af-f007-7005-b4f6-917028230d8c # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Dallin Notes Dump
    config:
      source: |-
        ### Dallin's Notes

        ## Database Schema

        * appth - basic appointment table
        * apptd - ties procedures back to appointments
        * claimh - basic claim table
        * claimd - seems to tie ledger entries back to claims
        * codes - master repo for all dcodes
        * feescheda - honestly not sure
        * feeschedh - a list of actual fee schedules
        * feeschedd - could be the actual fees?
        * inscoverage - what percentage of what codes are covered by what insurance plans
        * insplans - details on each ins plan
        * ledger - all transactions including procedures
        * ledgerinsd - additional ins details on certain ledger entries
        * ledgerpayd - ties ledger entries to bank, check, and eob numbers
        * ledgerpayalloc - ties payments back to procedures
        * office - each office in denticon (oid)
        * ogroup - useless
        * patient - standard patient table
        * patinsplan - ties patients to insurance plans
        * payadjust - adjustment types
        * pgroup - home of pgid, essentially the main group of practices (for most clients there's only one)
        * provider - basic provider table
        * respparty - might be the home of rpid?
        * treatplan - basic treatment plan table

        ### claimh
        basic claim table. it includes dos date, create date, submit date, and close date

        ### ledger
        positive means we charged, negative means we got paid

        status is always useless

        ### ledgerpayalloc
        this is crazy. it connects payments in the ledger to procedures in the ledger, so you can see all of the various procedures that any given payment goes to. 

        ltype:
        * P - patient payment
        * S - statement sent (very rare, no amount)
        * M - claims. never has an amount, updates when the claim is closed, resptype and claimid always populated
        * N - patients moving accounts (fairly rare, no amounts)
        * A - adjustment (always has a type2, which indicates either production or collections adjustment) (each of these adjustments also has a code, that could be really useful)
        * C - completed procedures (always has an amount. patpaid + estins = amount. Also has ucrfee. claimid. dosdate occasionally doesn't match trandate)
        * I - insurance payment or denial. always has a claimid. 

        Ledger Type: A= Adjustment; C=Charges; I= Insurance Payment; M=Claim Notes line; P=Patient Payment.

        Ledger Type 2: If ledgerType = P or I (type 2: 1 = cash, 2=check,3=creditcard, 4=direct deposit) If ledgerType = A(type 2 : P = production, C = Collection).

        ### respparty

        Responsible parties are something completely different than patients in Denticon, and I kinda like it. A single patient without family has a responsible party that is essentially themselves. 

        ## Basic balance by patient (confirmed accurate)
        ```sql
        select pat.fname, pat.lname, pat.oid, bal.patid, bal.bal
        from (
            select l.patid, sum(l.amount) bal
            from denticon.LEDGER l
            where (ltype = 'I' or ltype = 'P' or ltype = 'C' or ltype = 'A')
            group by l.patid
        ) bal
        left join denticon.patient pat on bal.patid = pat.patid
        ```

        ## General stuff to do

        I can't see claims, so that will inhibit me from seeing insurance AR

        The ledger is combined across all offices. This isn't a problem, except where patients get treatment done in multiple offices. In that case, I need to balance the patient ledger but also total production for each office. Truly, I should be grouping by responsible party, which will make this even worse. 

        What is the client doing with UCR? Can I factor that in? 

        Responsible party is a weird thing. The RPID is not the same as the PATID. A patient can be their own responsible party, but they have a RPID and a PATID that are different. 
        - I can fix this by just grouping by patient. The numbers only matter at a practice level, and if I'm totaling up practice numbers then it'll all bleed together. 

        The numbers that are logged as the procedure fee seem low, or UCR is high, or the client is just constantly getting overpaid by insurance for their work. 

        I want a way to date procedure charges and apply patient payments and insurance payments directly to those charges. Then once that's done, I can age the procedures completed and apply any unallocated payments to those procedures beginning with the oldest. 
