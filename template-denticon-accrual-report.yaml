  - cellType: SQL
    cellId: 019bc3af-f0c7-7005-b50f-726e4ff3a326 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: AR - True Patient Aging
    config:
      source: |-
        -- This is some tricky sql that applies payments and ins estimates to each aging bucket starting with 120+ until it runs out
        select
            ab.ar_date,
            ab.given_name,
            ab.family_name,
            ab.guar_id,
            ab.location_id,
            -ab.ins_over_120 ins_over_120,
            -ab.ins_91_120 ins_91_120,
            -ab.ins_61_90 ins_61_90,
            -ab.ins_31_60 ins_31_60,
            -ab.ins_0_30 ins_0_30,
            (case 
                when ab.pat_over_120 > -ab.unapplied_credits then ab.pat_over_120 + ab.unapplied_credits -- When the payment will not or only partially reduce the value of the first bucket
                else 0 -- When the payment will eliminate the value of the first bucket
            end) pat_over_120,
            (case 
                when ab.pat_over_120 >= -ab.unapplied_credits then ab.pat_91_120 -- When the unapplied_credits have already been exhaused on other buckets
                when ab.pat_over_120 + ab.pat_91_120 > -ab.unapplied_credits  then ab.pat_over_120 + ab.pat_91_120 + ab.unapplied_credits -- When a payment will reduce the value of the current bucket but not eliminate it
                else 0 -- When a payment will eliminate the value of the current bucket
            end) pat_91_120,
            (case 
                when ab.pat_over_120 + ab.pat_91_120 >= -ab.unapplied_credits then ab.pat_61_90
                when ab.pat_over_120 + ab.pat_91_120 + ab.pat_61_90 > -ab.unapplied_credits then ab.pat_over_120 + ab.pat_91_120 + ab.pat_61_90 + ab.unapplied_credits 
                else 0
            end) pat_61_90,
            (case 
                when ab.pat_over_120 + ab.pat_91_120 + ab.pat_61_90 >= -ab.unapplied_credits then ab.pat_31_60
                when ab.pat_over_120 + ab.pat_91_120 + ab.pat_61_90 + ab.pat_31_60 > -ab.unapplied_credits then ab.pat_over_120 + ab.pat_91_120 + ab.pat_61_90 + ab.pat_31_60 + ab.unapplied_credits 
                else 0 
            end) pat_31_60,
            (case 
                when ab.pat_over_120 + ab.pat_91_120 + ab.pat_61_90 + ab.pat_31_60 >= -ab.unapplied_credits then ab.pat_0_30
                when ab.pat_over_120 + ab.pat_91_120 + ab.pat_61_90 + ab.pat_31_60 + ab.pat_0_30 > -ab.unapplied_credits then ab.pat_over_120 + ab.pat_91_120 + ab.pat_61_90 + ab.pat_31_60 + ab.pat_0_30 + ab.unapplied_credits 
                else 0 
            end) pat_0_30,
            round(case when balance < 0 then ab.unapplied_credits + ab.pat_over_120 + ab.pat_91_120 + ab.pat_61_90 + ab.pat_31_60 + ab.pat_0_30 else 0 end, 2) outstanding_credits,
            ab.balance,
            ab.ins_est,
            ab.pat_resp
        from aging_breakdown ab
        where balance != 0
      dataFrameCell: true
      dataConnectionId: null
      resultVariableName: pat_aging
