  - cellType: SQL
    cellId: 019bc3af-f0c6-7005-b50f-19210a59ae7d # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Enriched Claims
    config:
      source: |-
        select 
            concat(c.claimid, '_', c.claimtype) as warehouse_id,
            cast(c.rpid as varchar) as guar_id,
            cast(c.oid as varchar) as location_id, 
            (case -- trying to recreate the claim state
                when c.claimstatus = 'P' or c.claimstatus = 'Q' then 'CREATED'
                when c.claimstatus = 'S' then 'SUBMITTED' 
                when c.claimstatus = 'C' then 'CLOSED'
                else c.claimstatus 
            end) state,
            c.claimdosdate as proc_time,
            c.claimsentdate as submit_time,
            (select max(ll.[TRANDATE]) from denticon.[LEDGER] ll where ll.[CLAIMID] = c.[CLAIMID] and ll.[LTYPE] = 'I') as pay_time, --getting max transaction date tied to claim 
            c.claimclosedate as close_time,
            c.modifiedon as update_time, 
            c.claimamt as total_billed_amount, 
            c.estinsamt as estimated_insurance_payment, 
            c.recvdamt as total_paid_amount
        from denticon.claimh c
        where ispreauth != 1
        order by warehouse_id
