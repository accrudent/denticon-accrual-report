    cellLabel: ledger vs pay_alloc
    config:
      source: |-
        select top 1000 
            lpa.[PAYLEDGERID],
            l.[LEDGERID], 
            l.[LTYPE], 
            l.[TRANDATE], 
            l.[DESCR],
            l.[AMOUNT] as ledger_amount, 
            sum(lpa.[AMOUNT]) as pay_alloc_amount
        from [denticon].[LEDGER] l
        left join [denticon].[LEDGERPAYALLOC] lpa on l.[LEDGERID] = lpa.[PAYLEDGERID]
