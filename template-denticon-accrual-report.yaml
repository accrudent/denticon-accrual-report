    cellId: 019bc3af-f0c7-7005-b50f-839821c72095 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: ledger OID <> payalloc OID
    config:
      source: |-
        select top 500
            lpa.[OID] as payalloc_oid,
            l.[OID] as ledger_oid,
            rp.[OID] as rp_oid,
            l.[DESCR],
            lpa.[AMOUNT] as lpa_amount,
            lpa.[ALLOCDATE],
            l.[DOSDATE],
            l.[TRANDATE]
        from [denticon].[LEDGERPAYALLOC] lpa
        left join [denticon].[LEDGER] l on lpa.[PAYLEDGERID] = l.[LEDGERID] --P, I, A
        left join [denticon].[RESPPARTY] rp on l.[RPID] = rp.[RPID]  -- respparty
        where lpa.[OID] <> l.[OID] and lpa.[OID] <> rp.[OID]-- where payalloc oid is not the same as ledger oid
        and l.[TRANDATE] > '2025-01-01'
        order by l.[TRANDATE]
