    cellId: 019bc3af-f0c6-7005-b50e-c3bb37ee7fc7 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Adjustment Inspector
    config:
      source: |-
        -- * ucr_writeoffs
        -- * ins_adj
        -- * discount_adj
        -- * payplan_adj
        -- * patrefund_adj
        -- * insrefund_adj
        -- * unknown_adj


        select top 200 
            l.[LTYPE], 
            l.[CODE], 
            l.[DESCR], 
            sum(l.[AMOUNT]) as total
        from [denticon].[LEDGER] l
        where l.[LTYPE] in ('A')
        and l.[DESCR] not like 'INSURANCE RECOUPMENT' --insrefund_adj
        and l.[DESCR] not like '%ins%' --insurance adjustment
        and l.[DESCR] not like 'ADJ OFF - Courtesy Discount' --discount
        and l.[DESCR] not like 'ADJ OFF - Uncollectable Balanc' --bad debt
        and l.[DESCR] not like 'ADJ OFF - Coupon' --discount
        and l.[DESCR] not like 'ADJ OFF - Failed Treatment' --discount
        and l.[DESCR] not like 'ADJ OFF - Treatment Incomplete' --discount
        and l.[DESCR] not like 'REFUND - Voided' --discount
        and l.[DESCR] not like 'ADJ OFF - Bad Debt' --bad debt
        and l.[DESCR] not like 'REFUND - Voided' --discount
        and l.[DESCR] not like 'ADJ OFF - Special Promotion' --discount
        and l.[DESCR] not like 'OrthoFX- Promo Discount' --discount
        and l.[DESCR] not like 'REFUND - Patient' --patrefund_adj
        and l.[DESCR] not like 'REFUND - 3rd Party Finance' --patrefund_adj
        and l.[DESCR] not like 'REFUND - Credit Card' --patrefund_adj



        group by l.[LTYPE], l.[CODE], l.[DESCR]
        order by abs(sum(l.[AMOUNT])) desc
