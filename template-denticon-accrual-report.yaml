    cellId: 019bc3af-f008-7005-b4f6-9e9c36e2ad15 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Denver Notes Dump
    config:
      source: |
        ### Denver's Notes

        #### Please check this query — it returns no data, which confirms that all patient payments (P), insurance payments (I), and adjustments (A) already have corresponding entries in LEDGERPAYALLOC.

        ```sql
        select top 1000 lpa.[PAYLEDGERID],l.[LEDGERID], l.[LTYPE], l.[TRANDATE], l.[DESCR]
        from [denticon].[LEDGER] l
        left join [denticon].[LEDGERPAYALLOC] lpa on l.[LEDGERID] = lpa.[PAYLEDGERID]
        where lpa.[PAYLEDGERID] is null and l.[TRANDATE] >= '2024-01-01' 
        and l.[LTYPE] in ('P', 'A', 'I')
        ```

        #### This one also verifies if all ledger amount for P, A, I equal their ledger pay allocation amount

        ```sql
        select top 1000 lpa.[PAYLEDGERID],l.[LEDGERID], l.[LTYPE], l.[TRANDATE], l.[DESCR],l.[AMOUNT] as ledger_amount, sum(lpa.[AMOUNT]) as pay_alloc_amount
        from [denticon].[LEDGER] l
        left join [denticon].[LEDGERPAYALLOC] lpa on l.[LEDGERID] = lpa.[PAYLEDGERID]
        where lpa.[PAYLEDGERID] is not null and l.[TRANDATE] >= '2024-01-01' 
        and l.[LTYPE] in ('P', 'A', 'I')
        group by lpa.[PAYLEDGERID],l.[LEDGERID], l.[LTYPE], l.[TRANDATE], l.[DESCR],l.[AMOUNT]
        --having l.[AMOUNT] <> sum(lpa.[AMOUNT])
        ```

        #### for patient pay, insurance pay, and adjustments that are not connected to the procedure even in ledgerpayalloc, do we want to backdate to earlier procedure?

        PGID - ID of practice group
        OID - office ID
        LEDGERID = ledger/transactions primary key
        RPID ?
        LTYPE = ledger type 
        P patient payment  , 
        I insurance payment, 
        A adjustment, 
        S statements?
        M claims
        N patient move, just ledger info no amount
        C procedures.
        ledger trandate = date data is posted in ledger?
        providerid = id of provider
        code = dcode
        adacode = not sure


        estins = insurance estimate 
        amount = billed amount or ucr
        patpaid = amout patient paid
        patadjust = amount patient adjustment


        claims linked to transactions ledger.  based on claimid
        the claim amount is based on UCR, since amount is different from insurance estimate, insurance estimate most likely fee schedule


        in ledger
        they do not write off difference from  amount and insurance estimate, instead it becomes patpaid (patient portion). Thus, AMOUNT = ESTINS + PATCLOSED
        when insurance pays different (most of the time underpays) amount compared to estins then portion is written off




        ledgerpaymentalloc basically tells how a payment (insurance , patient)  or adjustment is allocated to the procedures.... so 
