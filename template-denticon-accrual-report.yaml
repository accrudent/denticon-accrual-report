    cellId: 019bc3af-f008-7005-b4f6-b7850d31141a # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Reports
    config:
      source: "## Reports"
  - cellType: SQL
    cellId: 019bc3af-f0c6-7005-b50f-39f7e3a0dae9 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: PROD - Patient Balances
    config:
      source: |-
        --might need to group by oid also if some patient visit multiple practice

        select
            strftime(t.eff_time, '%Y-%m') as eff_month,
            max(p.given_name) given_name,
            max(p.family_name) family_name,
            t.guar_id,
            t.location_id,
            round(sum(case when t.tran_type = 'proc' then t.amount else 0 end), 2) prod,
            round(sum(case when t.tran_type = 'ucr_writeoff' then t.amount else 0 end), 2) ucr_writeoff,
            round(sum(case when t.tran_type = 'ins_adj' then t.amount else 0 end), 2) ins_adj,
            round(sum(case when t.tran_type = 'discount_adj' then t.amount else 0 end), 2) discount_adj,
            round(sum(case when t.tran_type = 'bd_adj' then t.amount else 0 end), 2) bd_adj,
            round(sum(case when t.tran_type = 'payplan_adj' then t.amount else 0 end), 2) payplan_adj,
            round(sum(case when t.tran_type = 'patrefund_adj' then t.amount else 0 end), 2) patrefund_adj,
            round(sum(case when t.tran_type = 'insrefund_adj' then t.amount else 0 end), 2) insrefund_adj,
            round(sum(case when t.tran_type = 'unknown_adj' then t.amount else 0 end), 2) unknown_adj,
            round(sum(case when t.tran_type = 'ins_pay' then t.amount else 0 end), 2) ins_pay,
            round(sum(case when t.tran_type = 'pat_pay' then t.amount else 0 end), 2) pat_pay,
            round(sum(t.amount), 2) total
        from trans t
        left join patients p on t.guar_id = p.guarantor
        where eff_time >= {{prod_limit_start}} and eff_time <= {{prod_limit_end}}
        group by 
            strftime(t.eff_time, '%Y-%m'),
            t.guar_id,
