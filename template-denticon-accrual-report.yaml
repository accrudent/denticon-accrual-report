    cellId: 019bc3af-f0c7-7005-b50f-781f235e3cfb # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: AR - Office Aging
    config:
      source: |-
        select
            pa.ar_date,
            o.officename,
            pa.location_id,
            round(sum(pa.ins_over_120), 2) ins_over_120,
            round(sum(pa.ins_91_120), 2) ins_91_120,
            round(sum(pa.ins_61_90), 2) ins_61_90,
            round(sum(pa.ins_31_60), 2) ins_31_60,
